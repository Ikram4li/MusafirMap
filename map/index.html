<style>
  html, body { height: 100%; margin: 0; }
  #map { height: 100%; width: 100%; }

  #searchBar {
    position: absolute;
    top: 10px; left: 50%; transform: translateX(-50%);
    z-index: 1000; background: white; padding: 10px;
    border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.25);
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    display: grid; grid-template-columns: auto 1.7fr 1.7fr 0.75fr 1.4fr; gap: 7px;

  }
  .field { position: relative; }
  input[type="text"], input[type="number"], select, button {
    width: 100%; padding: 8px 10px; font-size: 14px; box-sizing: border-box;
    border: 1px solid #ccc; border-radius: 6px;
  }
  #suggestHome, #suggestDest {
    position: absolute; left: 0; right: 0; top: calc(100% + 2px);
    background: white; border: 1px solid #ccc; border-radius: 6px;
    max-height: 220px; overflow-y: auto; display: none; z-index: 1100;
  }
  .suggestion { padding: 8px 10px; cursor: pointer; }
  .suggestion:hover { background: #f2f2f2; }

  #legend {
    position: absolute; bottom: 20px; right: 8px; z-index: 1000;
    background: white; padding: 5px 5px; border-radius: 8px;

    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    width: 150px;
  }
  #legend h4 { margin: 0 0 8px; font-size: 14px; text-align: center; }
  .legend-item { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
  .color-box { width: 18px; height: 18px; border-radius: 4px; border: 1px solid #0002; }
  .home-boundary { background: #000; }
  .home-buffer { background: #1e90ff; } /* blue */
  .dest-outside { background: #2ecc71; } /* green */
  .dest-inside { background: #e74c3c; }  /* red */
  .point-note { font-size: 10px; color: #555; margin-top: 8px; }

  /* === Hamburger Menu === */
  #menuWrap { position: relative; display: flex; align-items: center; justify-content: center; }
  .hamburger-btn {
    width: 36px; height: 36px;
    border-radius: 8px; border: 1px solid #ccc;
    background: #fff; cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
  }
  .hamburger-btn:focus { outline: 2px solid #1e90ff; outline-offset: 2px; }
  .hamburger-icon { width: 18px; height: 14px; position: relative; }
  .hamburger-icon span { position: absolute; left: 0; right: 0; height: 2px; background: #333; border-radius: 2px; }
  .hamburger-icon span:nth-child(1) { top: 0; }
  .hamburger-icon span:nth-child(2) { top: 6px; }
  .hamburger-icon span:nth-child(3) { top: 12px; }

  #menuDropdown {
    position: absolute; top: calc(100% + 6px); left: 0;
    min-width: 220px; background: #fff; border: 1px solid #ccc; border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.18); padding: 8px; z-index: 1200; display: none;
  }
  #menuDropdown.open { display: block; }
  .menu-item { display: flex; gap: 8px; align-items: center; padding: 8px 10px; border-radius: 8px; text-decoration: none; color: #222; font-size: 14px; }
  .menu-item:hover { background: #f5f7fb; }
  .menu-divider { height: 1px; background: #e5e7eb; margin: 6px 0; }
  @media (max-width: 560px) { #menuDropdown { min-width: 180px; } }

  #boundaryLoading[hidden] { display: none; }
  #boundaryLoading {
    position: fixed; inset: 0; z-index: 2000;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(255,255,255,.88); backdrop-filter: blur(3px);
    font: 600 16px system-ui, sans-serif; color: #18251b;
    cursor: progress;
  }
  .loading-track { width: 100%; overflow: hidden; padding: 20px 0; text-align: center; }
  .loading-camel {
    width: clamp(110px, 22vw, 180px); height: auto;
    animation: camel-travel 2.8s ease-in-out infinite alternate;
  }
  #boundaryLoading p { margin: 18px 20px; text-align: center; }
  @keyframes camel-travel {
    from { transform: translateX(-28vw) translateY(0); }
    to { transform: translateX(28vw) translateY(-8px); }
  }
  @media (prefers-reduced-motion: reduce) { .loading-camel { animation: none; } }

  #selectionStatus { position:absolute; z-index:1001; bottom:24px; left:10px;
    max-width:min(440px,calc(100vw - 190px)); padding:12px; border-radius:8px;
    background:white; color:#17251c; box-shadow:0 2px 10px #0003; font:14px system-ui; }
  #selectionStatus[hidden] { display:none; }
  #selectionStatus[data-state="error"] { border-left:4px solid #bd3030; }
  .suggestion { display:block; width:100%; text-align:left; border:0; background:white; }
  .suggestion:focus { outline:2px solid #1e90ff; outline-offset:-2px; }
  #searchHome, #searchDest { margin-top:4px; }
  @media(max-width:560px) { #selectionStatus { bottom:12px; max-width:calc(100vw - 195px); font-size:12px; } }

  #searchBar { box-sizing:border-box; }
  .field { min-width:0; }
  #homeInput, #destInput { padding-right:38px; }
  #searchHome, #searchDest { position:absolute; top:0; right:0; width:36px; height:100%; max-height:38px; margin:0; padding:6px; border:0; border-left:1px solid #ddd; border-radius:0 6px 6px 0; background:#f5f6f5; display:flex; align-items:center; justify-content:center; }
  #selectionStatus { box-sizing:border-box; }
  @media(max-width:560px) {
    #searchBar { width:calc(100vw - 16px); grid-template-columns:36px minmax(0,1fr) minmax(0,1fr); padding:8px; gap:6px; }
    #menuWrap { grid-column:1; grid-row:1 / 3; align-items:flex-start; }
    #searchBar > .field:nth-child(2) { grid-column:2 / 4; grid-row:1; }
    #searchBar > .field:nth-child(3) { grid-column:2 / 4; grid-row:2; }
    #searchBar > .field:nth-child(4) { grid-column:2; grid-row:3; }
    #searchBar > .field:nth-child(5) { grid-column:3; grid-row:3; }
    #selectionStatus { bottom:auto; left:8px; right:8px; max-width:none; font-size:12px; padding:8px; }
    #legend { bottom:24px; width:145px; font-size:11px; }
    #legend h4 { font-size:12px; margin-bottom:4px; }
    .legend-item { margin:4px 0; gap:6px; }
  }
</style>

<!-- Leaflet -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<!-- Turf.js -->
<script src="https://unpkg.com/@turf/turf@6.5.0/turf.min.js"></script>


<script src="/map/resolver.js?v=163f36a"></script>
<script>
  // === Hamburger Menu ===
  const menuBtn = document.getElementById('menuBtn');
  const menuDropdown = document.getElementById('menuDropdown');
  function closeMenu(){ menuDropdown.classList.remove('open'); menuBtn.setAttribute('aria-expanded','false'); }
  function openMenu(){ menuDropdown.classList.add('open'); menuBtn.setAttribute('aria-expanded','true'); }
  function toggleMenu(){ menuDropdown.classList.contains('open') ? closeMenu() : openMenu(); }
  menuBtn.addEventListener('click', (e)=>{ e.stopPropagation(); toggleMenu(); });
  document.addEventListener('click', (e)=>{ if (!document.getElementById('menuWrap').contains(e.target)) closeMenu(); });
  document.addEventListener('keydown', (e)=>{ if (e.key === 'Escape') closeMenu(); });
  menuDropdown.addEventListener('keydown', (e)=>{
    const items = Array.from(menuDropdown.querySelectorAll('a.menu-item'));
    const i = items.indexOf(document.activeElement);
    if (e.key === 'ArrowDown'){ e.preventDefault(); (items[(i+1)%items.length]||items[0]).focus(); }
    if (e.key === 'ArrowUp'){ e.preventDefault(); (items[(i-1+items.length)%items.length]||items.at(-1)).focus(); }
  });

  // ===== Map Setup =====
  const map = L.map('map', { zoomControl: false }).setView([53.795, -1.759], 10);
  L.control.zoom({ position: 'bottomleft' }).addTo(map);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  // ===== Layers =====
  const homeBoundaryLayer = L.geoJSON(null, { style: { color: '#000', weight: 3, fillOpacity: 0.15 } }).addTo(map);
  const homeBufferLayer   = L.geoJSON(null, { style: { color: '#1e90ff', weight: 3, fillOpacity: 0.10 } }).addTo(map);
  const homeMarkerLayer   = L.layerGroup().addTo(map);

  const destOutsideLayer  = L.geoJSON(null, { style: { color: '#2ecc71', weight: 3, fillOpacity: 0.15 } }).addTo(map);
  const destInsideLayer   = L.geoJSON(null, { style: { color: '#e74c3c', weight: 3, fillOpacity: 0.15 } }).addTo(map);
  const destMarkerLayer   = L.layerGroup().addTo(map);

  // ===== State =====
  let homeGeometry = null;   // Feature (Polygon/MultiPolygon) OR Point
  let homeBuffer   = null;   // Feature (Polygon/MultiPolygon)
  let destGeometry = null;   // Feature (Polygon/MultiPolygon) OR Point
  let destPinLatLng = null;  // [lat, lon] when destination is address/postcode centre

  // Destination pin colors (darker shades of existing colors)
  const PIN_GREEN = '#27ae60';
  const PIN_RED   = '#c0392b';

  const homeInput = document.getElementById('homeInput');
  const destInput = document.getElementById('destInput');
  const suggestHome = document.getElementById('suggestHome');
  const suggestDest = document.getElementById('suggestDest');
  const radiusInput = document.getElementById('radiusInput');
  const unitsSelect = document.getElementById('unitsSelect');
  const locateBtn   = document.getElementById('locateBtn');

  const resolver = new MusafirResolver.Client();
  const selectionStatus = document.getElementById('selectionStatus');
  const versions = { home: 0, destination: 0 };
  const selectedPlaces = { home: null, destination: null };
  const notes = { home: '', destination: '' };
  let locationVersion = 0;
  function status(message, state='info') {
    selectionStatus.textContent=message; selectionStatus.dataset.state=state;
    selectionStatus.hidden=!message;
    if (window.matchMedia && window.matchMedia('(max-width:560px)').matches) selectionStatus.style.top=(document.getElementById('searchBar').getBoundingClientRect().bottom+8)+'px';
  }
  function summary() { status([notes.home, notes.destination].filter(Boolean).join(' ')); }
  function invalidate(role) {
    versions[role]++; selectedPlaces[role]=null; notes[role]='';
    if(role==='home') {homeGeometry=null; homeBuffer=null; clearHomeLayers(); updateDestinationOverlap();}
    else {destGeometry=null; destPinLatLng=null; clearDestLayers();}
    summary();
  }

  // ===== Boundary loading overlay =====
  const boundaryLoading = document.getElementById('boundaryLoading');
  let pendingBoundaryLoads = 0;
  function showBoundaryLoading() {
    pendingBoundaryLoads++;
    boundaryLoading.hidden = false;
    document.getElementById('map').setAttribute('aria-busy', 'true');
  }
  function hideBoundaryLoading() {
    pendingBoundaryLoads = Math.max(0, pendingBoundaryLoads - 1);
    if (!pendingBoundaryLoads) {
      boundaryLoading.hidden = true;
      document.getElementById('map').setAttribute('aria-busy', 'false');
    }
  }
  async function withBoundaryLoading(task) {
    showBoundaryLoading();
    try {
      // Let the browser paint the logo before geometry calculations start.
      await new Promise(resolve => requestAnimationFrame(() => setTimeout(resolve, 0)));
      return await task();
    } finally { hideBoundaryLoading(); }
  }

  // ===== Helpers =====
  function clearHomeLayers() {
    homeBoundaryLayer.clearLayers();
    homeBufferLayer.clearLayers();
    homeMarkerLayer.clearLayers();
  }
  function clearDestLayers() {
    destOutsideLayer.clearLayers();
    destInsideLayer.clearLayers();
    destMarkerLayer.clearLayers();
  }

  function currentRadiusUnits() {
    const radius = parseFloat(radiusInput.value);
    const units  = unitsSelect.value;
    if (isNaN(radius) || radius <= 0) throw new Error('Radius must be > 0');
    return { radius, units };
  }

  function collectBounds() {
    const groups = [];
    if (homeBoundaryLayer.getLayers().length) groups.push(homeBoundaryLayer);
    if (homeBufferLayer.getLayers().length)   groups.push(homeBufferLayer);
    if (destOutsideLayer.getLayers().length)  groups.push(destOutsideLayer);
    if (destInsideLayer.getLayers().length)   groups.push(destInsideLayer);
    if (homeMarkerLayer.getLayers().length)   groups.push(homeMarkerLayer);
    if (destMarkerLayer.getLayers().length)   groups.push(destMarkerLayer);
    if (!groups.length) return null;
    const fg = L.featureGroup(groups.flatMap(g => g.getLayers ? g.getLayers() : [g]));
    return fg.getBounds();
  }

  function fitToData() {
    const b = collectBounds();
    if (b && b.isValid()) map.fitBounds(b.pad(0.2));
  }

  const isPolygonal = MusafirResolver.polygonal;

  // Build a teardrop pin icon with black outline
  function createPinIcon(color) {
    const svg = `
      <svg xmlns="http://www.w3.org/2000/svg" width="26" height="38" viewBox="0 0 26 38">
        <path d="M13 1C6.1 1 1 6.3 1 13.2c0 8.4 9.1 18.1 12 24.9 2.9-6.8 12-16.5 12-24.9C25 6.3 19.9 1 13 1z" fill="${color}" stroke="#000" stroke-width="2"/>
        <circle cx="13" cy="13" r="4.2" fill="#fff" stroke="#000" stroke-width="2"/>
      </svg>`;
    return L.divIcon({ html: svg, className: 'pin-icon', iconSize: [26, 38], iconAnchor: [13, 36] });
  }

  function addDestinationPin() {
    if (!destPinLatLng) return;
    if (homeBuffer) {
      const pt = turf.point([destPinLatLng[1], destPinLatLng[0]]); // lon,lat
      const inside = turf.booleanPointInPolygon(pt, homeBuffer);
      const color = inside ? PIN_RED : PIN_GREEN;
      const lines=turf.polygonToLine(homeBuffer);
      const distance=Math.min(...(lines.type==='FeatureCollection'?lines.features:[lines]).map(line=>turf.pointToLineDistance(pt,line,{units:'kilometers'})));
      if(distance<1 && selectedPlaces.destination?.precision!=='address') {
        notes.destination='Destination pin is within 1 km of the threshold. A street/postcode centre may not represent your actual address.';
      }
      destMarkerLayer.addLayer(L.marker(destPinLatLng, { icon: createPinIcon(color) }));
    } else {
      destMarkerLayer.addLayer(L.marker(destPinLatLng, { icon: createPinIcon('#333') }));
    }
  }
  function addDestinationPinAt(lat, lon) { destPinLatLng = [lat, lon]; addDestinationPin(); }

  function drawHome(geom) {
    const {radius,units}=currentRadiusUnits();
    const buffer=turf.buffer(geom,radius,{units});
    if(!isPolygonal(buffer))throw new Error('The home threshold could not be calculated.');
    clearHomeLayers();homeGeometry=geom;homeBuffer=buffer;
    if(isPolygonal(geom))homeBoundaryLayer.addData(geom);
    else {const [lon,lat]=geom.geometry.coordinates;homeMarkerLayer.addLayer(L.marker([lat,lon]));}
    homeBufferLayer.addData(homeBuffer);updateDestinationOverlap();fitToData();
  }

  function drawDestination(geom) {
    clearDestLayers();
    destGeometry = geom;
    destPinLatLng = isPolygonal(geom) ? null :
      [geom.geometry.coordinates[1], geom.geometry.coordinates[0]];
    updateDestinationOverlap();
    fitToData();
  }

  function updateDestinationOverlap() {
    destOutsideLayer.clearLayers();
    destInsideLayer.clearLayers();
    destMarkerLayer.clearLayers();
    if (!destGeometry) return;
    if(selectedPlaces.destination?.note)notes.destination=selectedPlaces.destination.note;

    // Precise destinations are pins only; the radius belongs to the home city.
    if (!isPolygonal(destGeometry)) {
      addDestinationPin();
      return;
    }
    if (!homeBuffer) {
      destOutsideLayer.addData(destGeometry);
      return;
    }
    try {
      const inside = turf.intersect(destGeometry, homeBuffer);
      const outside = turf.difference(destGeometry, homeBuffer);
      if (inside) destInsideLayer.addData(inside);
      if (outside) destOutsideLayer.addData(outside);
      if(inside && outside)notes.destination='The destination area straddles the threshold. Choose your actual address for a point result.';
    } catch (e) { throw new Error('The destination outline loaded, but its overlap could not be calculated. No result is shown.'); }
  }

  // ===== Selection pipeline: choose identity -> resolve -> commit latest result =====
  async function pickPlace(place, role) {
    const version=++versions[role];
    const container=role==='home'?suggestHome:suggestDest;
    container.style.display='none';
    try {
      await withBoundaryLoading(async()=>{
        const result=await resolver.resolve(place,role);
        if(version!==versions[role])return;
        const input=role==='home'?homeInput:destInput;
        // Commit state only after successful resolution, including the visible label.
        selectedPlaces[role]=result;
        input.value=result.place.display_name || result.place.name;
        notes[role]=result.precision==='home-circle'
          ? 'Home outline unavailable: using an approximate circle from the selected point.'
          : result.precision==='boundary'
          ? (role==='home'?'Home':'Destination')+': '+(result.geometry.properties.name || result.place.name)+
            ' ('+(result.geometry.properties.boundaryType || 'mapped')+' boundary; may differ from the built-up settlement).'
          : 'Destination: '+(result.precision==='address'?'address pin.':'approximate '+result.precision+' centre pin; choose an exact address if close to the threshold.');
        result.note=notes[role];
        if(role==='home')drawHome(result.geometry);else drawDestination(result.geometry);
        summary();
      });
    }catch(e){if(version===versions[role])status(e.message,'error');}
  }
  function renderSuggestions(container, places, role) {
    container.replaceChildren();
    if(!places.length){container.style.display='none';status('No matching places found. Include the town and country.');return;}
    places.forEach(p=>{
      const button=document.createElement('button');button.type='button';
      button.className='suggestion';button.setAttribute('role','option');
      button.textContent=p.display_name+' — '+(p.kind==='area'?'area':p.kind==='unknown'?'unclassified':p.kind+' pin');
      button.addEventListener('click',()=>pickPlace(p,role));container.appendChild(button);
    });
    container.style.display='block';
  }
  async function runSearch(role) {
    const input=role==='home'?homeInput:destInput;
    const container=role==='home'?suggestHome:suggestDest;
    const q=input.value.trim();if(q.length<3){status('Enter at least three characters to search.');return;}
    const version=++versions[role];
    container.replaceChildren();container.style.display='none';
    status('Searching…');
    try {
      const places=await resolver.search(q);
      if(version!==versions[role])return;
      status('Choose a result to confirm the location.');renderSuggestions(container,places,role);
    }catch(e){if(version===versions[role])status(e.message,'error');}
  }
  for(const [role,input,container,button] of [
    ['home',homeInput,suggestHome,document.getElementById('searchHome')],
    ['destination',destInput,suggestDest,document.getElementById('searchDest')]
  ]) {
    input.addEventListener('input',()=>{invalidate(role);container.replaceChildren();container.style.display='none';});
    input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();runSearch(role);}if(e.key==='ArrowDown')container.querySelector('button')?.focus();});
    button.addEventListener('click',()=>runSearch(role));
    container.addEventListener('keydown',e=>{
      const items=[...container.querySelectorAll('button')],i=items.indexOf(document.activeElement);
      if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();items[(i+(e.key==='ArrowDown'?1:-1)+items.length)%items.length]?.focus();}
      if(e.key==='Escape'){container.style.display='none';input.focus();}
    });
  }
  document.addEventListener('click',e=>{
    if(!document.getElementById('searchBar').contains(e.target)){suggestHome.style.display='none';suggestDest.style.display='none';}
  });
  locateBtn.addEventListener('click',()=>{
    if(!navigator.geolocation){status('Your browser does not support location access. Search for your home city.','error');return;}
    invalidate('home');const version=versions.home,location=++locationVersion;
    locateBtn.disabled=true;locateBtn.textContent='Locating…';showBoundaryLoading();
    const finish=()=>{hideBoundaryLoading();if(location===locationVersion){locateBtn.disabled=false;locateBtn.textContent='📍 Locate Me (Home)';}};
    navigator.geolocation.getCurrentPosition(async pos=>{
      try{
        const place=await resolver.reverse(pos.coords.latitude,pos.coords.longitude);
        if(version===versions.home)await pickPlace(place,'home');
      }catch(e){if(version===versions.home)status(e.message,'error');}
      finally{finish();}
    },err=>{if(version===versions.home)status('Location access failed: '+err.message+'. You can search for your home city.','error');finish();},{timeout:20000});
  });

  // ===== Radius / Units change =====
  function recomputeAll() { if (homeGeometry) { drawHome(homeGeometry); } if (destGeometry) { drawDestination(destGeometry); } }
  radiusInput.addEventListener('change', async () => { try { await withBoundaryLoading(recomputeAll); summary(); } catch(e){ status(e.message,'error'); } });
  unitsSelect.addEventListener('change', async () => { try { await withBoundaryLoading(recomputeAll); summary(); } catch(e){ status(e.message,'error'); } });
</script>
</body>
</html>
